server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# The build is a true SPA (`fallback: 'index.html'` in svelte.config.js):
	# every route is client-rendered and there are no per-path files, so a cold
	# deep link like /promises/checkout-7f3a has to boot the app and let the
	# router take over.
	#
	# The =404 on the inner try_files matters. A blanket `try_files $uri
	# /index.html` also swallows a missing hashed asset — a stale index
	# requesting a chunk that is not in this image would receive HTML with a 200,
	# and the browser reports that as a module parse error rather than as the
	# missing file it is. Under /_app/ a miss stays a miss.
	location /_app/ {
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	# SvelteKit fetches this to decide whether a failed chunk load means "the
	# app updated under you, reload". A heuristically-cached copy would answer
	# that question with the previous release, so the reload never happens and
	# the stale page stays broken.
	location = /_app/version.json {
		try_files $uri =404;
		add_header Cache-Control "no-cache";
	}

	# Vite writes content-hashed filenames under /_app/immutable, so those are
	# safe to cache indefinitely — a change ships under a new name.
	#
	# `add_header` alone, not `expires`: both emit a Cache-Control, and setting
	# both sends the header twice (`max-age=31536000` and `public, immutable`).
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Fonts are vendored (static/fonts) and change with a release, not within
	# one. They are not hashed, so this is a bounded cache rather than immutable.
	location /fonts/ {
		add_header Cache-Control "public, max-age=2592000";
	}

	# index.html must never be cached: it carries the references to the hashed
	# bundles, so a cached copy pins a browser to the previous release's assets
	# — which, per the =404 rule above, then fail loudly instead of silently.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
}
